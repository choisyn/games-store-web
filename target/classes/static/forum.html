<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>讨论广场 - 游戏社区</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --steam-dark-bg: #1b2838;
            --steam-light-bg: #2a475e;
            --steam-card-bg: #1e2837;
            --steam-hover: #16202d;
            --steam-blue: #66c0f4;
            --steam-text: #c7d5e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1b2838 0%, #2a475e 100%);
            color: var(--steam-text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: var(--steam-card-bg);
            border-radius: 8px;
            padding: 25px 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: var(--steam-blue);
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--steam-blue);
            color: #1b2838;
        }

        .btn-primary:hover {
            background: #4db8e8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 192, 244, 0.4);
        }

        .btn-secondary {
            background: var(--steam-light-bg);
            color: var(--steam-text);
        }

        .btn-secondary:hover {
            background: var(--steam-hover);
        }

        .filter-section {
            background: var(--steam-card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .filter-row {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-label {
            font-weight: 500;
            color: var(--steam-text);
        }

        .filter-select {
            padding: 8px 12px;
            border: 1px solid var(--steam-light-bg);
            border-radius: 4px;
            background: var(--steam-dark-bg);
            color: var(--steam-text);
            font-size: 14px;
            min-width: 200px;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--steam-blue);
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 400px;
        }

        .search-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--steam-light-bg);
            border-radius: 4px;
            background: var(--steam-dark-bg);
            color: var(--steam-text);
            font-size: 14px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--steam-blue);
        }

        .posts-container {
            background: var(--steam-card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            min-height: 400px;
        }

        .post-item {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .post-item:hover {
            background: var(--steam-hover);
            margin: 0 -20px;
            padding: 20px;
            border-radius: 4px;
        }

        .post-item:last-child {
            border-bottom: none;
        }

        .post-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }

        .post-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-pinned {
            background: #f5576c;
            color: white;
        }

        .badge-featured {
            background: #ffd93d;
            color: #1b2838;
        }

        .badge-game {
            background: var(--steam-blue);
            color: #1b2838;
        }

        .post-title {
            font-size: 18px;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-content {
            color: var(--steam-text);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-meta {
            display: flex;
            gap: 20px;
            color: #8f98a0;
            font-size: 13px;
        }

        .post-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .post-author {
            color: var(--steam-blue);
            font-weight: 500;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding: 20px 0;
        }

        .page-btn {
            padding: 8px 15px;
            border: 1px solid var(--steam-light-bg);
            background: var(--steam-card-bg);
            color: var(--steam-text);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .page-btn:hover:not(:disabled) {
            background: var(--steam-hover);
            border-color: var(--steam-blue);
        }

        .page-btn.active {
            background: var(--steam-blue);
            color: #1b2838;
            border-color: var(--steam-blue);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--steam-text);
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--steam-text);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            .filter-row {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                max-width: none;
            }

            .filter-select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1><i class="bi bi-chat-dots"></i> 讨论广场</h1>
            <div class="header-actions">
                <a href="/" class="btn btn-secondary"><i class="bi bi-house"></i> 返回首页</a>
                <a href="/community" class="btn btn-secondary"><i class="bi bi-people"></i> 返回社区</a>
                <a href="create-post.html" class="btn btn-primary" id="createPostBtn"><i class="bi bi-plus-circle"></i> 发布讨论</a>
            </div>
        </div>

        <!-- 筛选区域 -->
        <div class="filter-section">
            <div class="filter-row">
                <span class="filter-label">游戏筛选：</span>
                <select class="filter-select" id="gameFilter">
                    <option value="">所有游戏</option>
                </select>
                
                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索讨论...">
                    <button class="btn btn-primary" onclick="searchPosts()">搜索</button>
                </div>
            </div>
        </div>

        <!-- 帖子列表 -->
        <div class="posts-container">
            <div id="postsContent">
                <div class="loading">加载中...</div>
            </div>

            <!-- 分页 -->
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';
        let currentPage = 0;
        let totalPages = 0;
        let currentGameId = null;

        // 页面加载时初始化
        window.onload = function() {
            loadGames();
            loadPosts();
            checkLogin();
        };

        // 检查登录状态
        function checkLogin() {
            const token = localStorage.getItem('token');
            const createPostBtn = document.getElementById('createPostBtn');
            
            if (!token) {
                createPostBtn.onclick = function(e) {
                    e.preventDefault();
                    alert('请先登录！');
                    window.location.href = 'index.html';
                };
            }
        }

        // 加载游戏列表
        async function loadGames() {
            try {
                const response = await fetch(`${API_BASE_URL}/games?page=0&size=100`);
                const result = await response.json();
                
                if (result.code === 200 && result.data) {
                    const gameFilter = document.getElementById('gameFilter');
                    // 检查data是否是分页对象还是直接数组
                    const games = result.data.content || result.data;
                    
                    if (Array.isArray(games)) {
                        games.forEach(game => {
                            const option = document.createElement('option');
                            option.value = game.id;
                            option.textContent = game.name;
                            gameFilter.appendChild(option);
                        });
                    }

                    // 添加筛选事件
                    gameFilter.addEventListener('change', function() {
                        currentGameId = this.value || null;
                        currentPage = 0;
                        loadPosts();
                    });
                }
            } catch (error) {
                console.error('加载游戏列表失败:', error);
            }
        }

        // 加载帖子列表
        async function loadPosts() {
            const postsContent = document.getElementById('postsContent');
            postsContent.innerHTML = '<div class="loading">加载中...</div>';

            try {
                let url = `${API_BASE_URL}/posts?page=${currentPage}&size=20`;
                if (currentGameId) {
                    url += `&gameId=${currentGameId}`;
                }

                const response = await fetch(url);
                const result = await response.json();

                if (result.code === 200 && result.data) {
                    const posts = result.data.content;
                    totalPages = result.data.totalPages;

                    if (posts.length === 0) {
                        postsContent.innerHTML = `
                            <div class="empty">
                                <div class="empty-icon">📭</div>
                                <p>暂无讨论，快来发布第一条吧！</p>
                            </div>
                        `;
                    } else {
                        postsContent.innerHTML = posts.map(post => createPostHTML(post)).join('');
                    }

                    renderPagination();
                } else {
                    console.error('API返回错误:', result);
                    postsContent.innerHTML = '<div class="empty">加载失败，请稍后重试</div>';
                }
            } catch (error) {
                console.error('加载帖子失败:', error);
                postsContent.innerHTML = '<div class="empty">加载失败，请稍后重试</div>';
            }
        }

        // 创建帖子HTML
        function createPostHTML(post) {
            const badges = [];
            if (post.isPinned) badges.push('<span class="post-badge badge-pinned">置顶</span>');
            if (post.isFeatured) badges.push('<span class="post-badge badge-featured">精华</span>');
            if (post.gameName) badges.push(`<span class="post-badge badge-game">${post.gameName}</span>`);

            const createdTime = formatTime(post.createdAt);
            const lastActiveTime = post.lastCommentAt ? formatTime(post.lastCommentAt) : createdTime;

            return `
                <div class="post-item" onclick="viewPost(${post.id})">
                    <div class="post-header">
                        ${badges.join('')}
                    </div>
                    <div class="post-title">
                        ${escapeHtml(post.title)}
                    </div>
                    <div class="post-content">
                        ${escapeHtml(post.content)}
                    </div>
                    <div class="post-meta">
                        <span class="post-meta-item">
                            <span class="post-author">${escapeHtml(post.username || '匿名用户')}</span>
                        </span>
                        <span class="post-meta-item">👁️ ${post.viewCount || 0}</span>
                        <span class="post-meta-item">💬 ${post.commentCount || 0}</span>
                        <span class="post-meta-item">👍 ${post.likeCount || 0}</span>
                        <span class="post-meta-item">🕐 ${lastActiveTime}</span>
                    </div>
                </div>
            `;
        }

        // 渲染分页
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = `
                <button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 0 ? 'disabled' : ''}>
                    上一页
                </button>
            `;

            for (let i = 0; i < totalPages; i++) {
                if (i === 0 || i === totalPages - 1 || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `
                        <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">
                            ${i + 1}
                        </button>
                    `;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += '<span>...</span>';
                }
            }

            html += `
                <button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages - 1 ? 'disabled' : ''}>
                    下一页
                </button>
            `;

            pagination.innerHTML = html;
        }

        // 跳转到指定页
        function goToPage(page) {
            if (page >= 0 && page < totalPages) {
                currentPage = page;
                loadPosts();
                window.scrollTo(0, 0);
            }
        }

        // 查看帖子详情
        function viewPost(postId) {
            window.location.href = `post-detail.html?id=${postId}`;
        }

        // 搜索帖子
        async function searchPosts() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) {
                alert('请输入搜索关键词');
                return;
            }

            const postsContent = document.getElementById('postsContent');
            postsContent.innerHTML = '<div class="loading">搜索中...</div>';

            try {
                const response = await fetch(`${API_BASE_URL}/posts/search?keyword=${encodeURIComponent(keyword)}&page=0&size=20`);
                const result = await response.json();

                if (result.code === 200 && result.data) {
                    const posts = result.data.content || result.data;
                    totalPages = result.data.totalPages || 1;
                    currentPage = 0;

                    if (!Array.isArray(posts) || posts.length === 0) {
                        postsContent.innerHTML = `
                            <div class="empty">
                                <div class="empty-icon">🔍</div>
                                <p>没有找到相关讨论</p>
                                <button class="btn btn-secondary" onclick="clearSearch()">清除搜索</button>
                            </div>
                        `;
                    } else {
                        postsContent.innerHTML = posts.map(post => createPostHTML(post)).join('');
                    }

                    renderPagination();
                } else {
                    postsContent.innerHTML = `
                        <div class="empty">
                            <p>搜索失败,请稍后重试</p>
                            <button class="btn btn-secondary" onclick="clearSearch()">返回</button>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('搜索失败:', error);
                postsContent.innerHTML = `
                    <div class="empty">
                        <p>搜索失败,请稍后重试</p>
                        <button class="btn btn-secondary" onclick="clearSearch()">返回</button>
                    </div>
                `;
            }
        }

        // 清除搜索
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            currentPage = 0;
            loadPosts();
        }

        // 格式化时间
        function formatTime(dateString) {
            if (!dateString) return '';
            
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            
            const minute = 60 * 1000;
            const hour = 60 * minute;
            const day = 24 * hour;
            
            if (diff < minute) {
                return '刚刚';
            } else if (diff < hour) {
                return Math.floor(diff / minute) + '分钟前';
            } else if (diff < day) {
                return Math.floor(diff / hour) + '小时前';
            } else if (diff < 7 * day) {
                return Math.floor(diff / day) + '天前';
            } else {
                return date.toLocaleDateString('zh-CN');
            }
        }

        // HTML转义
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 搜索框回车事件
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchPosts();
            }
        });
    </script>
</body>
</html>
