<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理系统 - 游戏社区商城</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #1b2838;
            color: #c7d5e0;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        /* 侧边栏 */
        .sidebar {
            width: 250px;
            background: linear-gradient(135deg, #1e3a5f 0%, #2a475e 100%);
            padding: 20px 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .sidebar-header h4 {
            color: #66c0f4;
            margin: 0;
            font-weight: 600;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0 10px;
            margin: 0;
        }

        .sidebar-menu li {
            margin-bottom: 5px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: #c7d5e0;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            background: rgba(102, 192, 244, 0.2);
            color: #66c0f4;
        }

        .sidebar-menu a i {
            margin-right: 10px;
            font-size: 18px;
        }

        /* 主内容区 */
        .main-content {
            margin-left: 250px;
            flex: 1;
            padding: 30px;
        }

        .page-header {
            background: linear-gradient(135deg, #2a475e 0%, #1e3a5f 100%);
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .page-header h2 {
            margin: 0;
            color: #66c0f4;
            font-size: 28px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #2a475e 0%, #1e3a5f 100%);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .stat-card h3 {
            font-size: 14px;
            color: #8f98a0;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: 600;
            color: #66c0f4;
            margin-bottom: 10px;
        }

        .stat-card .icon {
            font-size: 48px;
            color: rgba(102, 192, 244, 0.3);
            float: right;
        }

        /* 表格样式 */
        .data-table {
            background: #2a475e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .table {
            color: #c7d5e0;
            margin: 0;
        }

        .table thead {
            background: #1e3a5f;
        }

        .table tbody tr {
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .table tbody tr:hover {
            background: rgba(102, 192, 244, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #66c0f4 0%, #4a90e2 100%);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4a90e2 0%, #66c0f4 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
            border: none;
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffa726 0%, #ff9800 100%);
            border: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #66bb6a 0%, #4caf50 100%);
            border: none;
        }

        .badge {
            padding: 5px 10px;
        }

        /* 模态框样式 */
        .modal-content {
            background: #2a475e;
            color: #c7d5e0;
        }

        .modal-header {
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .modal-footer {
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .form-control, .form-select {
            background: #1b2838;
            border: 1px solid #3c5a72;
            color: #c7d5e0;
        }

        .form-control:focus, .form-select:focus {
            background: #1b2838;
            border-color: #66c0f4;
            color: #c7d5e0;
            box-shadow: 0 0 0 0.2rem rgba(102, 192, 244, 0.25);
        }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h4><i class="bi bi-shield-lock"></i> 管理系统</h4>
            <small id="adminUsername">管理员</small>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#dashboard" class="menu-link active" data-page="dashboard">
                <i class="bi bi-speedometer2"></i> 仪表盘
            </a></li>
            <li><a href="#games" class="menu-link" data-page="games">
                <i class="bi bi-controller"></i> 游戏管理
            </a></li>
            <li><a href="#community" class="menu-link" data-page="community">
                <i class="bi bi-chat-square-dots"></i> 社区管理
            </a></li>
            <li><a href="#users" class="menu-link" data-page="users">
                <i class="bi bi-people"></i> 用户管理
            </a></li>
            <li><a href="#categories" class="menu-link" data-page="categories">
                <i class="bi bi-tags"></i> 分类管理
            </a></li>
            <li><a href="#banners" class="menu-link" data-page="banners">
                <i class="bi bi-images"></i> 轮播图管理
            </a></li>
            <li><a href="/" class="menu-link">
                <i class="bi bi-house-door"></i> 返回首页
            </a></li>
            <li><a href="#" class="menu-link" onclick="logout(event)">
                <i class="bi bi-box-arrow-right"></i> 退出登录
            </a></li>
        </ul>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <div id="content-area">
            <!-- 动态加载内容 -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            loadPage('dashboard');
            
            // 绑定菜单点击事件
            document.querySelectorAll('.menu-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    const page = this.getAttribute('data-page');
                    if (page) {
                        e.preventDefault();
                        loadPage(page);
                        
                        // 更新菜单激活状态
                        document.querySelectorAll('.menu-link').forEach(l => l.classList.remove('active'));
                        this.classList.add('active');
                    }
                });
            });
        });

        // 检查登录状态
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/current');
                const data = await response.json();
                
                if (data.code !== 200 || data.data.role !== 'ADMIN') {
                    alert('您没有权限访问后台管理系统！');
                    window.location.href = '/login';
                    return;
                }
                
                document.getElementById('adminUsername').textContent = data.data.username;
            } catch (error) {
                console.error('检查权限失败:', error);
                window.location.href = '/login';
            }
        }

        // 加载页面内容
        function loadPage(page) {
            const contentArea = document.getElementById('content-area');
            
            switch(page) {
                case 'dashboard':
                    loadDashboard();
                    break;
                case 'games':
                    loadGamesPage();
                    break;
                case 'community':
                    loadCommunityPage();
                    break;
                case 'users':
                    loadUsersPage();
                    break;
                case 'categories':
                    loadCategoriesPage();  // 加载分类管理页面
                    break;
                case 'banners':
                    loadBannersPage();
                    break;
            }
        }

        // 退出登录
        async function logout(event) {
            event.preventDefault();
            if (confirm('确定要退出登录吗？')) {
                try {
                    await fetch('/api/auth/logout', { method: 'POST' });
                    window.location.href = '/';
                } catch (error) {
                    console.error('退出登录失败:', error);
                }
            }
        }
    </script>
    
    <!-- 各页面的JS脚本 -->
    <script th:src="@{/js/admin/dashboard.js}"></script>
    <script th:src="@{/js/admin/games.js}"></script>
    <script th:src="@{/js/admin/community.js}"></script>
    <script th:src="@{/js/admin/users.js}"></script>
    <script th:src="@{/js/admin/banners.js}"></script>
    <script th:src="@{/js/admin/categories.js}"></script>
</body>
</html>
